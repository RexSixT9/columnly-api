services:
  - type: web
    name: columnly-api
    runtime: node
    plan: free
    # Build tooling (typescript, tsc-alias, @types/*) lives in devDependencies, so
    # dev deps must be installed even when NODE_ENV=production is set.
    buildCommand: 'npm install --include=dev && npm run build'
    startCommand: 'npm start'
    healthCheckPath: /api/v1
    envVars:
      # Render sets NODE_ENV=production and PORT at runtime automatically.
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: WHITELIST_ADMINS
        sync: false
      - key: WHITE_LISTED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: ACCESS_TOKEN_EXPIRATION
        value: 1h
      - key: REFRESH_TOKEN_EXPIRATION
        value: 7d
